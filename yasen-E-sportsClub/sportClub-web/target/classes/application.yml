server:
  port: 9001
  servlet:
    context-path: /api
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yasenesports?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mappers/*.xml

# JWT配置
jwt:
  secret: yasen-esports-club-jwt-secret-key-2026-must-be-at-least-256-bits
  expiration: 86400000  # Token有效期，默认24小时（毫秒）

# 微信小程序配置
wechat:
  mini:
    appid: your-appid-here      # 替换为你的微信小程序AppID
    secret: your-secret-here    # 替换为你的微信小程序AppSecret

##项目目录
#project:
